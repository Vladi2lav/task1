# Полное развёртывание: PostgreSQL + веб-портал (gunicorn) + планировщик ежедневного сбора.
#
#   docker compose up -d --build     запуск (первый раз загружаются данные из дампа docs/db)
#   docker compose logs -f           логи
#   docker compose down              остановка (данные остаются в томе pgdata)
#
# Настройки — в файле .env (образец .env.example); без .env работают значения по умолчанию.
# Подробности: docs/DEPLOY.md

name: trades-portal

x-app: &app
  image: trades-portal:latest
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-trades}:${POSTGRES_PASSWORD:-trades}@db:5432/${POSTGRES_DB:-trades}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
    # если DJANGO_SECRET_KEY не задан, ключ генерируется в этот файл при первом старте;
    # переменная нужна и командам `docker compose exec`
    DJANGO_SECRET_KEY_FILE: /app/data/secret_key
    # логи контейнера — в stdout (docker compose logs)
    DJANGO_LOG_FILE: "off"
    TZ: Asia/Almaty
  volumes:
    - appdata:/app/data
    # расписание и параметры сбора можно менять без пересборки: правка + docker compose restart
    - ./scraper.toml:/app/scraper.toml:ro

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trades}
      POSTGRES_USER: ${POSTGRES_USER:-trades}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trades}
      TZ: Asia/Almaty
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    <<: *app
    # образ собирает только web; scheduler использует тот же образ
    build: .
    command: ["web"]
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    <<: *app
    pull_policy: never
    command: ["scheduler"]
    # веб-сервера в этом контейнере нет — проверка /healthz из образа не нужна
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      # web к моменту готовности уже выполнил миграции (bootstrap)
      web:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
